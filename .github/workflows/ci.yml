name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run drizzle migrations against ephemeral SQLite
        run: npm run db:migrate
        env:
          DATABASE_URL: ./ci.db

      - name: Generate tRPC schema
        # Same database the migration step above just prepared: the generator
        # boots the whole app, and the app legitimately expects its schema to
        # exist (RemindersModule declares its cron schedule at bootstrap).
        run: npm run trpc:generate
        env:
          DATABASE_URL: ./ci.db

      - name: Typecheck
        run: npm run typecheck

      # The generated AppRouter is transformer-enabled (server runs superjson),
      # so a client link without the matching transformer fails right here.
      - name: Typecheck tRPC client
        run: npm run client-smoke:typecheck

      - name: Lint
        run: npm run lint

      - name: Cognitive complexity gate
        run: npm run complexity:check

      # The README table and badge, the package.json description, and the docs/
      # Pages site all claim which libraries this app composes and at which
      # versions. This fails when any of them drifts behind the declared deps.
      - name: Docs roster gate
        run: npm run docs:check

      - name: Tests with coverage
        run: npm run test:cov

      - name: Security audit
        run: npm run security:audit

      - name: Build
        run: npm run build

      - name: Smoke
        run: npm run smoke

      # Typed-client walk of the API, including the superjson Date round-trip.
      - name: tRPC client smoke
        run: npm run client-smoke

      - name: Upload coverage artifacts
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/lcov-report/**
          if-no-files-found: warn

  kafka-e2e:
    name: Kafka profile e2e (live broker)
    runs-on: ubuntu-latest
    # The Kafka profile's gated end-to-end spec
    # (test/integration/reliable-messaging.kafka.spec.ts) against the Redpanda
    # broker docker-compose.yml defines — the one `npm run infra:up` starts
    # locally. It is started with compose rather than as a service container,
    # because a service container cannot be given Redpanda's start flags. The
    # spec skips when KAFKA_BROKERS is unset, so this job runs it through
    # test:kafka:strict, which fails unless every test in it ran — a wiring
    # mistake here cannot pass as green.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Start Redpanda
        # AUTH_SECRET only satisfies the compose file's parse-time check for the
        # api/worker services; it never reaches the broker.
        run: AUTH_SECRET=infra-only-placeholder docker compose --profile kafka up -d --wait redpanda

      - name: Run the Kafka profile against a live broker
        env:
          KAFKA_BROKERS: localhost:19092
          KAFKA_TOPIC_PREFIX: reliable-e2e.
        run: npm run test:kafka:strict

      - name: Dump broker logs on failure
        if: failure()
        run: docker logs nest-reference-app-redpanda || true

  rabbitmq-e2e:
    name: RabbitMQ profile e2e (live broker)
    runs-on: ubuntu-latest
    # The RabbitMQ profile's gated end-to-end spec
    # (test/integration/reliable-messaging.rabbitmq.spec.ts) against a real
    # RabbitMQ 4. The spec skips when RABBITMQ_URL is unset, so this job runs it
    # through test:rabbitmq:strict, which fails unless every test in it ran —
    # a wiring mistake here cannot pass as green.
    services:
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: app
          RABBITMQ_DEFAULT_PASS: app
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run the RabbitMQ profile against a live broker
        env:
          RABBITMQ_URL: amqp://app:app@127.0.0.1:5672
          RABBITMQ_MANAGEMENT_URL: http://app:app@127.0.0.1:15672
        run: npm run test:rabbitmq:strict
