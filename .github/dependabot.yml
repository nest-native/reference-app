version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      dev-tooling-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      # Majors are grouped deliberately, not just minors and patches. The
      # @nestjs/* packages are a set with peer dependencies on each other, so a
      # major that arrives one-package-per-PR produces a tree npm refuses to
      # install: NestJS 12 opened fifteen separate PRs across this org, each
      # bumping one package and leaving its siblings on 11, and every one failed
      # `npm ci` with ERESOLVE before a single test ran. Grouped, a major
      # arrives as one PR that can actually be evaluated.
      nest-stack:
        update-types:
          - "major"
          - "minor"
          - "patch"
        patterns:
          - "@nestjs/common"
          - "@nestjs/core"
          - "@nestjs/platform-express"
          - "@trpc/*"
          - "drizzle-orm"
          - "drizzle-kit"
          - "@nest-native/*"
          - "@authlock/core"
          - "@stalefree/core"
          - "reflect-metadata"
          - "rxjs"
          - "zod"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
